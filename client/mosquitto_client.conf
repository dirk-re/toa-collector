# Mosquitto-Konfiguration: lokaler Broker auf dem Client-Gerät (Windows 11).
# Zielort: C:\Program Files\mosquitto\mosquitto.conf (ersetzt die Standardkonfiguration)
# Vor Inbetriebnahme anpassen: ZENTRAL-IP, remote_password, Benutzer in passwd.

# Lokaler Broker auf dem Client-Gerät
listener 1883 0.0.0.0
allow_anonymous false
password_file C:\Program Files\mosquitto\passwd

# Pufferung (Kernstueck bei Netzwerkausfall):
persistence true
persistence_location C:\mosquitto-data
autosave_interval 60
max_queued_messages 100000
queue_qos0_messages false

# Bridge zum zentralen Broker auf dem DB-Geraet:
connection bridge-zentral
address ZENTRAL-IP:1883
topic s7/# out 1
bridge_protocol_version mqttv311
cleansession false
notifications false
try_private false
remote_username dbwriter
remote_password DBWRITER_PASSWORT
