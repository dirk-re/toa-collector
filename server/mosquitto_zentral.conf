# Mosquitto-Konfiguration: zentraler Broker auf dem Datenbankgerät.
# Linux-Zielort:  /etc/mosquitto/mosquitto.conf
# Windows-Zielort: C:\Program Files\mosquitto\mosquitto.conf
# Vor Inbetriebnahme anpassen: Benutzer in der passwd-Datei
# (dbwriter, db-subscriber).
# Wichtig: mosquitto akzeptiert Kommentare nur am Zeilenanfang;
# Kommentare hinter einem Wert fuehren zum Abbruch beim Start.

listener 1883 0.0.0.0
allow_anonymous false
# Passwortdatei (Windows: C:\Program Files\mosquitto\passwd)
password_file /etc/mosquitto/passwd

persistence true
# Persistenzverzeichnis, mit abschließendem Schrägstrich
# (Windows: C:\mosquitto-data\)
persistence_location /var/lib/mosquitto/
autosave_interval 60
max_queued_messages 100000
queue_qos0_messages false
max_inflight_messages 100
