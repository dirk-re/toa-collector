# Mosquitto-Konfiguration: zentraler Broker auf dem Datenbankgerät.
# Linux-Zielort:  /etc/mosquitto/mosquitto.conf
# Windows-Zielort: C:\Program Files\mosquitto\mosquitto.conf
# Vor Inbetriebnahme anpassen: password_file und persistence_location je nach
# Betriebssystem, Benutzer in der passwd-Datei (dbwriter, db-subscriber).

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd        # Windows: C:\Program Files\mosquitto\passwd

persistence true
persistence_location /var/lib/mosquitto/   # Windows: C:\mosquitto-data
autosave_interval 60
max_queued_messages 100000
queue_qos0_messages false
max_inflight_messages 100
